<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acerca de Tauri Music App</title>
    <style>
      :root { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; color: #111827; background: #f3f4f6; }
      body { margin: 0; padding: 1.5rem; }
      main { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 1.5rem; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { color: #4b5563; line-height: 1.6; }
      .version { color: #6b7280; font-size: .9rem; margin-top: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tauri Music App</h1>
      <p>Aplicación para organizar colecciones de música, crear listas de reproducción y reproducir archivos de audio almacenados en el equipo.</p>
      <p>Los metadatos de canciones y listas de reproducción se guardan en una base de datos SQLite.</p>
      <p class="version">Versión 1.0</p>
    </main>
  </body>
</html>
